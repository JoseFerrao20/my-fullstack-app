name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR makes the running checks obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, migrations, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskapp
          POSTGRES_PASSWORD: taskapp
          POSTGRES_DB: taskapp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://taskapp:taskapp@localhost:5432/taskapp
      TEST_DATABASE_URL: postgresql+psycopg://taskapp:taskapp@localhost:5432/taskapp_test
      ENABLE_SCHEDULER: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Migrations apply and match the models
        run: |
          alembic upgrade head
          alembic check
      - name: Create the test database
        run: PGPASSWORD=taskapp psql -h localhost -U taskapp -c "CREATE DATABASE taskapp_test"
      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend (eslint, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright on the Docker stack)
    runs-on: ubuntu-latest
    # Builds the images too, so this also guards the Dockerfiles.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Generate push (VAPID) keys so the push settings are exercised
        run: docker compose run --rm --no-deps backend python -m app.core.push >> .env
      - name: Start the app
        env:
          # Every test request comes from one IP; real limits would block the suite.
          DISABLE_RATE_LIMITS: "true"
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf http://localhost/api/health && exit 0; sleep 2; done
          docker compose logs
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - name: App logs
        if: failure()
        run: docker compose logs --no-color > e2e/compose-logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/compose-logs.txt
          retention-days: 7
