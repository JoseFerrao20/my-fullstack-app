name: Deploy

# After CI passes on main, update the production server to exactly the commit CI tested.
# Does nothing until the DEPLOY_* secrets are set (see docs/deploy.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer one waits for the current one to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/taskapp' }}
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Skip when the server isn't configured yet
        id: configured
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "DEPLOY_HOST secret not set: nothing to deploy to yet." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.configured.outputs.ok == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # Pinned host keys (from `ssh-keyscan`), so the deploy can't be redirected to another machine.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Update the server
        if: steps.configured.outputs.ok == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && sh deploy/update.sh '$COMMIT'"
          echo "Deployed \`$COMMIT\` to $DEPLOY_HOST" >> "$GITHUB_STEP_SUMMARY"
