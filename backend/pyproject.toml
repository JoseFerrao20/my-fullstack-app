[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "taskapp-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "apscheduler>=3.10,<4",
    "python-dateutil>=2.9",
    "tzdata>=2024.1",
    "pywebpush>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, simplify
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "B008",  # FastAPI's Depends()/Query() in defaults is the intended pattern
    "UP046",  # Envelope uses Generic[T] on purpose: Pydantic's support for PEP 695 classes is newer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # long literal assertions read better on one line
"tests/conftest.py" = ["E402"]  # env var must be set before importing the app

[tool.ruff.lint.isort]
known-first-party = ["app", "main", "tests"]
# The local alembic/ folder holds migrations; the import is the third-party library.
known-third-party = ["alembic"]
